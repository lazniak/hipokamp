# /etc/nginx/sites-available/hub.example.com.conf: hub synchronizacji hipokampa (docs/SYNC.md).
# Po włączeniu: certbot --nginx -d hub.example.com (dopisze listen 443, certyfikat i przekierowanie z 80).
# Hub odrzuca żądania bez X-Forwarded-Proto: https, więc zwykłe HTTP nigdy nie dotknie danych.

# Pierwsza linia obrony przed zalewem z internetu (plik jest dołączany w kontekście http, więc strefy mogą być tu).
# Hub ma własne limity per adres (X-Real-IP niżej, HIPOKAMP_SYNC_TRUST_PROXY=1 w docker-compose.yml), a adresy
# IPv6 liczy po podsieci /64 (nginx liczy po pojedynczym adresie, więc zalew z jednej podsieci zatrzymuje dopiero hub).
limit_req_zone $binary_remote_addr zone=hipokamp_anon:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=hipokamp_join:10m rate=6r/m;
# reszta API: urządzenie przy pierwszej wysyłce robi kilkadziesiąt żądań, więc limit luźny; chroni przed zalewem
# żądaniami bez klucza do /v1/me, /v1/entries, /v1/join/<prośba> (hub ma dla nich też własny limit per adres)
limit_req_zone $binary_remote_addr zone=hipokamp_api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name hub.example.com;

    # żądanie wysyłki ma do 8 MB (wpis do 2 MB, do 64 wpisów)
    client_max_body_size 9m;

    # domyślny format access_log nie zawiera nagłówka Authorization (klucz urządzenia); nie zmieniaj go na taki, który zawiera
    access_log /var/log/nginx/hipokamp.access.log;
    error_log /var/log/nginx/hipokamp.error.log;

    # wspólne ustawienia proxy; X-Real-IP nadpisuje wartość od klienta (hub ufa temu nagłówkowi tylko za tym proxy)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # prośby o dołączenie (bez klucza): mało na adres
    location = /v1/join {
        limit_req zone=hipokamp_join burst=5 nodelay;
        proxy_pass http://127.0.0.1:47790;
    }

    # bez klucza: health i bootstrap
    location ~ ^/v1/(health|bootstrap)$ {
        limit_req zone=hipokamp_anon burst=20 nodelay;
        proxy_pass http://127.0.0.1:47790;
    }

    # reszta wymaga klucza urządzenia (limit per urządzenie w hubie; bez klucza: limit per adres w hubie i tutaj)
    location / {
        limit_req zone=hipokamp_api burst=200 nodelay;
        proxy_pass http://127.0.0.1:47790;
    }
}
